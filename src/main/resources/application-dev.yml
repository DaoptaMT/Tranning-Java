server:
  port: 8000
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:/db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

jwt:
  secret-key : ${JWT_SECRET_KEY}
  refresh-key : ${JWT_REFRESH_KEY}

springdoc:
  swagger-ui:
    url: /openapi.yml    # Đường dẫn public tới file YAML (qua HTTP)
    path: /swagger-ui.html
  api-docs:
    enabled: true        # Tắt tự động sinh API docs từ annotation nếu muốn

